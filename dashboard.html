<script type="text/babel">
// ─── DATA LOADING ──────────────────────────────────────────────────────────
const GITHUB_RAW = "https://raw.githubusercontent.com/krishna-on-gh/earnings-bot/main";

const readEmbedded = (id) => {
  try { return JSON.parse(document.getElementById(id).textContent); }
  catch { return null; }
};

const isHttp = window.location.protocol.startsWith("http");

const loadData = async () => {
  if (isHttp) {
    try {
      const ts = Date.now();
      const base = GITHUB_RAW || ".";
      const [recs, trades, pos, budget, accuracy, callsLog, portfolioHist] = await Promise.all([
        fetch(`${base}/data/recommendations.json?_=${ts}`).then(r => r.json()),
        fetch(`${base}/data/trades_history.json?_=${ts}`).then(r => r.json()),
        fetch(`${base}/data/positions.json?_=${ts}`).then(r => r.json()),
        fetch(`${base}/data/budget_tracker.json?_=${ts}`).then(r => r.json()),
        fetch(`${base}/data/earnings_accuracy.json?_=${ts}`).then(r => r.json()).catch(()=>({})),
        fetch(`${base}/data/earnings_calls_log.json?_=${ts}`).then(r => r.json()).catch(()=>[]),
        fetch(`${base}/data/portfolio_history.json?_=${ts}`).then(r => r.json()).catch(()=>({})),
      ]);
      return { recs, trades, positions: pos, budget, accuracy, callsLog, portfolioHist, live: true };
    } catch {}
  }
  return {
    recs:      readEmbedded("__RECOMMENDATIONS__") || [],
    trades:    readEmbedded("__TRADES__")          || [],
    positions: readEmbedded("__POSITIONS__")       || {},
    budget:    readEmbedded("__BUDGET__")          || {},
    accuracy:     readEmbedded("__ACCURACY__")        || {},
    callsLog:     readEmbedded("__CALLS_LOG__")       || [],
    portfolioHist:readEmbedded("__PORTFOLIO_HIST__")  || {},
    meta:         readEmbedded("__META__")            || {},
    live:         false,
  };
};

// ─── HELPERS ───────────────────────────────────────────────────────────────
const fmt$ = (n) => { if(n==null) return "—"; return `${n>=0?"+":"-"}$${Math.abs(n).toFixed(2)}`; };
const fmtPct = (n) => { if(n==null) return "—"; return `${n>=0?"+":"-"}${Math.abs(n).toFixed(1)}%`; };
const pnlCls = (v) => v>0?"g":v<0?"r":"w";
const daysUntil = (s) => { if(!s) return null; return Math.ceil((new Date(s)-new Date())/(864e5)); };
const confBadge = (c) => {
  const cls = c>=95?"bg":c>=90?"by":"bgr";
  return <span className={`badge ${cls}`}>{c}%</span>;
};

// ─── COMPONENTS ────────────────────────────────────────────────────────────
const MetricsRow = ({ positions, trades }) => {
  const closed = (trades||[]).filter(t=>t.status==="closed");
  const wins   = closed.filter(t=>(t.pnl||0)>0).length;
  const wr     = closed.length ? wins/closed.length*100 : 0;
  const tPnl   = closed.reduce((s,t)=>s+(t.pnl||0),0);
  const dPnl   = positions?.daily_pnl||0;
  const open   = (positions?.positions||[]).length;
  return (
    <div className="g4">
      {[
        { val: fmt$(dPnl),            cls: pnlCls(dPnl), lbl: "Today's P&L" },
        { val: fmt$(tPnl),            cls: pnlCls(tPnl), lbl: "Total P&L" },
        { val: `${wr.toFixed(0)}%`,   cls: wr>=60?"g":wr>=40?"y":"r", lbl: `Win Rate (${closed.length} trades)` },
        { val: String(open),          cls: "b",           lbl: "Open Positions" },
      ].map(m => (
        <div className="card metric" key={m.lbl}>
          <div className={`val ${m.cls}`}>{m.val}</div>
          <div className="lbl">{m.lbl}</div>
        </div>
      ))}
    </div>
  );
};

const BudgetSection = ({ budget }) => {
  if (!budget) return null;
  const totalPct = Math.min(100,(budget.total_deployed||0)/(budget.total_cap||45000)*100);
  const barColor = (p) => p>90?"#f85149":p>70?"#e3b341":"#3fb950";
  return (
    <div className="card">
      <div className="ct">Budget Tracker</div>
      {budget.halted && <div className="halted">TRADING HALTED — {budget.halt_reason}</div>}
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontWeight:600}}>Total Earnings Budget ($45k cap)</span>
          <span className={totalPct>90?"r":"w"}>${(budget.total_deployed||0).toFixed(0)} / ${(budget.total_cap||45000).toFixed(0)}</span>
        </div>
        <div className="pb"><div className="pf" style={{width:`${totalPct}%`,background:barColor(totalPct)}} /></div>
        <div className="pl"><span>{totalPct.toFixed(0)}% used</span><span>${(budget.available_total||0).toFixed(0)} remaining</span></div>
      </div>
      <div className="ts">Last updated: {budget.last_updated||"—"}</div>
    </div>
  );
};

const WinnersLosers = ({ positions }) => {
  const openPos = (positions?.positions||[]);
  if (openPos.length < 2) return null;
  const sorted = [...openPos].sort((a,b)=>(b.unrealized_plpc||0)-(a.unrealized_plpc||0));
  const winner = sorted[0];
  const loser  = sorted[sorted.length-1];
  return (
    <div className="card" style={{display:"flex",gap:24}}>
      <div style={{flex:1}}>
        <div className="ct" style={{color:"#3fb950"}}>Biggest Winner (Unrealized)</div>
        <div style={{fontSize:22,fontWeight:700}}>{winner.symbol}</div>
        <div className="g" style={{fontSize:18}}>{fmtPct((winner.unrealized_plpc||0)*100)}</div>
        <div style={{color:"#8b949e",fontSize:13}}>{fmt$(winner.unrealized_pl)} unrealized</div>
      </div>
      <div style={{flex:1}}>
        <div className="ct" style={{color:"#f85149"}}>Biggest Loser (Unrealized)</div>
        <div style={{fontSize:22,fontWeight:700}}>{loser.symbol}</div>
        <div className="r" style={{fontSize:18}}>{fmtPct((loser.unrealized_plpc||0)*100)}</div>
        <div style={{color:"#8b949e",fontSize:13}}>{fmt$(loser.unrealized_pl)} unrealized</div>
      </div>
    </div>
  );
};

const TopFiveSection = ({ trades }) => {
  const closed = (trades||[]).filter(t=>t.status==="closed"&&t.pnl!=null);
  if (!closed.length) return null;
  const sorted = [...closed].sort((a,b)=>(b.pnl_pct||0)-(a.pnl_pct||0));
  const top5    = sorted.slice(0,5);
  const bottom5 = sorted.slice(-5).reverse();
  const Row = ({t}) => (
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #21262d"}}>
      <span style={{fontWeight:700,width:60}}>{t.symbol}</span>
      <span style={{color:"#8b949e",fontSize:12}}>{t.exit_date}</span>
      <span className={pnlCls(t.pnl_pct)} style={{fontWeight:600}}>{fmtPct(t.pnl_pct)}</span>
      <span className={pnlCls(t.pnl)} style={{fontSize:13}}>{fmt$(t.pnl)}</span>
    </div>
  );
  return (
    <div className="g2">
      <div className="card">
        <div className="ct" style={{color:"#3fb950"}}>Top 5 Wins</div>
        {top5.map((t,i)=><Row key={i} t={t}/>)}
      </div>
      <div className="card">
        <div className="ct" style={{color:"#f85149"}}>Top 5 Losses</div>
        {bottom5.map((t,i)=><Row key={i} t={t}/>)}
      </div>
    </div>
  );
};

const AccuracyTracker = ({ accuracy, callsLog }) => {
  const tiers = ["70-84%", "85-94%", "95-100%"];
  const tierColors = {"70-84%":"#e3b341","85-94%":"#58a6ff","95-100%":"#3fb950"};
  const hasData = tiers.some(t => (accuracy[t]?.calls||0) > 0);
  return (
    <div className="card">
      <div className="ct">Confidence Accuracy Tracker</div>
      {!hasData
        ? <div style={{color:"#8b949e",padding:"10px 0"}}>No closed trades yet — accuracy will populate as earnings plays exit.</div>
        : <div>
            {tiers.map(tier => {
              const d = accuracy[tier] || {calls:0,correct:0};
              const pct = d.calls > 0 ? Math.round(d.correct/d.calls*100) : null;
              const barColor = pct==null?"#21262d":pct>=70?"#3fb950":pct>=50?"#e3b341":"#f85149";
              return (
                <div key={tier} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontWeight:600,color:tierColors[tier]}}>{tier} Confidence</span>
                    <span style={{color:"#c9d1d9"}}>
                      {pct!=null ? <strong>{pct}%</strong> : "—"}
                      <span style={{color:"#8b949e",fontSize:12}}> ({d.correct}/{d.calls} calls correct)</span>
                    </span>
                  </div>
                  <div className="pb">
                    <div className="pf" style={{width:`${pct||0}%`,background:barColor}}/>
                  </div>
                </div>
              );
            })}
          </div>
      }
      {callsLog?.length > 0 && (
        <div style={{marginTop:14,borderTop:"1px solid #21262d",paddingTop:12}}>
          <div style={{fontSize:11,fontWeight:600,color:"#8b949e",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}>Recent Call Analysis</div>
          {[...callsLog].reverse().slice(0,3).map((e,i) => (
            <div key={i} style={{marginBottom:10,paddingBottom:10,borderBottom:i<2?"1px solid #1c2128":"none"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
                <strong>{e.symbol}</strong>
                <span className={`badge ${e.outcome==="WIN"?"bg":"br"}`}>{e.outcome}</span>
                <span style={{color:"#8b949e",fontSize:12}}>{e.exit_date}</span>
                <span style={{color:"#8b949e",fontSize:12,marginLeft:"auto"}}>{fmtPct(e.pnl_pct)}</span>
              </div>
              <div style={{color:"#8b949e",fontSize:12,lineHeight:1.5}}>{e.analysis}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const PortfolioChart = ({ portfolioHist }) => {
  const [tab, setTab] = React.useState("1D");
  const [hover, setHover] = React.useState(null);
  const svgRef = React.useRef(null);

  const dataset = portfolioHist?.[tab];
  const points  = dataset?.points || [];

  if (!points.length) return (
    <div className="card">
      <div className="ct">Portfolio Performance</div>
      <div style={{color:"#8b949e",padding:"20px 0",fontSize:13}}>Chart available after first monitor run with live Alpaca data.</div>
    </div>
  );

  const W = 600, H = 180, PL = 52, PR = 12, PT = 16, PB = 28;
  const cw = W - PL - PR, ch = H - PT - PB;

  const vals   = points.map(p => p.v);
  const minV   = Math.min(...vals);
  const maxV   = Math.max(...vals);
  const range  = maxV - minV || 1;
  const base   = points[0]?.v || 0;
  const last   = points[points.length - 1]?.v || 0;
  const isUp   = last >= base;
  const color  = isUp ? "#3fb950" : "#f85149";
  const fillId = `pf-grad-${tab}`;

  const sx = (i)  => PL + (i / (points.length - 1)) * cw;
  const sy = (v)  => PT + ch - ((v - minV) / range) * ch;

  const linePath = points.map((p,i) => `${i===0?"M":"L"}${sx(i).toFixed(1)},${sy(p.v).toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L${(PL+cw).toFixed(1)},${(PT+ch).toFixed(1)} L${PL},${(PT+ch).toFixed(1)} Z`;

  const fmtTime = (ts) => {
    const d = new Date(ts * 1000);
    if (tab === "1M") return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    if (tab === "1W") return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
    return d.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",hour12:true});
  };

  const handleMouse = (e) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    const idx = Math.max(0, Math.min(points.length - 1, Math.round((mx - PL) / cw * (points.length - 1))));
    setHover({ idx, x: sx(idx), y: sy(points[idx].v), point: points[idx] });
  };

  const pnl = last - base;
  const pnlPct = base ? (pnl / base * 100) : 0;

  return (
    <div className="card">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div className="ct" style={{marginBottom:0}}>Portfolio Performance</div>
        <div style={{display:"flex",gap:6}}>
          {["1D","1W","1M"].map(t => (
            <button key={t} onClick={()=>{setTab(t);setHover(null);}}
              style={{background:tab===t?"#21262d":"transparent",border:`1px solid ${tab===t?"#58a6ff":"#30363d"}`,
                color:tab===t?"#58a6ff":"#8b949e",padding:"2px 10px",borderRadius:6,cursor:"pointer",fontSize:12}}>
              {t}
            </button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:8}}>
        <span style={{fontSize:22,fontWeight:700,color:"#e6edf3"}}>
          ${hover ? hover.point.v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})
                  : last.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
        </span>
        {!hover && <span style={{marginLeft:10,fontSize:13,color}}>{pnl>=0?"+":""}{pnl.toFixed(2)} ({pnlPct>=0?"+":""}{pnlPct.toFixed(2)}%) {tab}</span>}
        {hover && <span style={{marginLeft:10,fontSize:12,color:"#8b949e"}}>{fmtTime(hover.point.t)}</span>}
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",cursor:"crosshair"}}
        onMouseMove={handleMouse} onMouseLeave={()=>setHover(null)}>
        <defs>
          <linearGradient id={fillId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
            <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {/* Y-axis labels */}
        {[0,0.5,1].map(f => {
          const v = minV + f * range;
          const y = PT + ch - f * ch;
          return (
            <g key={f}>
              <line x1={PL} y1={y} x2={PL+cw} y2={y} stroke="#21262d" strokeWidth="1"/>
              <text x={PL-4} y={y+4} textAnchor="end" fill="#8b949e" fontSize="10">
                ${(v/1000).toFixed(1)}k
              </text>
            </g>
          );
        })}
        {/* Area fill */}
        <path d={areaPath} fill={`url(#${fillId})`}/>
        {/* Line */}
        <path d={linePath} fill="none" stroke={color} strokeWidth="1.5"/>
        {/* Hover crosshair */}
        {hover && <>
          <line x1={hover.x} y1={PT} x2={hover.x} y2={PT+ch} stroke="#8b949e" strokeWidth="1" strokeDasharray="3,3"/>
          <circle cx={hover.x} cy={hover.y} r="4" fill={color} stroke="#0d1117" strokeWidth="2"/>
        </>}
        {/* X-axis baseline */}
        <line x1={PL} y1={PT+ch} x2={PL+cw} y2={PT+ch} stroke="#30363d" strokeWidth="1"/>
      </svg>
    </div>
  );
};

const EarningsWeek = ({ recs, positions }) => {
  const owned = new Set((positions?.positions||[]).map(p=>p.symbol));
  const todayStr = new Date().toLocaleDateString("en-CA");
  const in7Date  = new Date(); in7Date.setDate(in7Date.getDate()+7);
  const in7Str   = in7Date.toLocaleDateString("en-CA");
  const rows = (recs||[])
    .filter(r => r.earnings_date && r.earnings_date.slice(0,10) >= todayStr && r.earnings_date.slice(0,10) <= in7Str)
    .sort((a,b) => a.earnings_date.slice(0,10).localeCompare(b.earnings_date.slice(0,10)));
  if (!rows.length) return null;
  const normDate = (d) => d ? d.slice(0, 10) : d;
  const dayLabel = (dateStr) => {
    if (dateStr === todayStr) return "Today";
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    if (dateStr === tomorrow.toLocaleDateString("en-CA")) return "Tomorrow";
    const d = new Date(dateStr + "T12:00:00");
    return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
  };
  const timingLabel = (t) => {
    if (t==="pre_market")  return {text:"BMO",color:"#e3b341"};
    if (t==="post_market") return {text:"AMC",color:"#58a6ff"};
    return {text:"TBD",color:"#8b949e"};
  };
  // Group by date — normalize to YYYY-MM-DD to avoid timestamp mismatches
  const byDate = {};
  rows.forEach(r => { const k = normDate(r.earnings_date); (byDate[k]=byDate[k]||[]).push(r); });
  return (
    <div className="card">
      <div className="ct">Earnings This Week ({rows.length})</div>
      {Object.entries(byDate).map(([date, stocks]) => (
        <div key={date} style={{marginBottom:14}}>
          <div style={{fontWeight:700,color:"#58a6ff",marginBottom:6,fontSize:13,textTransform:"uppercase",letterSpacing:"0.05em"}}>
            {dayLabel(date)}
          </div>
          {stocks.map(r => {
            const tl = timingLabel(r.earnings_timing);
            const held = owned.has(r.symbol) || r.executed;
            return (
              <div key={r.symbol} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0",borderBottom:"1px solid #21262d"}}>
                <span style={{fontWeight:700,width:52}}>{r.symbol}</span>
                <span style={{color:"#8b949e",fontSize:12,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.company}</span>
                <span style={{fontSize:11,color:tl.color,whiteSpace:"nowrap"}}>{tl.text}</span>
                {confBadge(r.confidence)}
                {held && <span className="badge bg" style={{fontSize:10}}>HELD</span>}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
};

const RecsTable = ({ recs, positions }) => {
  const owned = new Set((positions?.positions||[]).map(p=>p.symbol));
  const todayStr = new Date().toLocaleDateString("en-CA");
  const rows = (recs||[]).filter(r=>!r.executed&&!r.disqualified&&!owned.has(r.symbol)&&r.earnings_date>=todayStr).sort((a,b)=>b.confidence-a.confidence);
  return (
    <div className="card">
      <div className="ct">Upcoming Earnings Plays ({rows.length})</div>
      {!rows.length
        ? <div style={{color:"#8b949e",padding:"10px 0"}}>No recommendations yet — scanner runs nightly at 11 PM ET.</div>
        : <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr>
                <th>Symbol</th><th>Company</th><th>Earnings</th><th>Days</th>
                <th>Confidence</th><th>Beat Rate</th><th>Rev Growth</th>
                <th>Momentum</th><th>Size</th><th>Status</th>
              </tr></thead>
              <tbody>
                {rows.map(r=>{
                  const d=daysUntil(r.earnings_date);
                  const rv=r.revenue_growth_yoy;
                  const mo=r.momentum_30d;
                  return (
                    <tr key={r.symbol}>
                      <td><strong>{r.symbol}</strong></td>
                      <td style={{maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.company}</td>
                      <td>{r.earnings_date}</td>
                      <td style={{textAlign:"center"}}>{d??'—'}</td>
                      <td>{confBadge(r.confidence)}</td>
                      <td>{r.beat_rate!=null?`${(r.beat_rate*100).toFixed(0)}%`:"—"}</td>
                      <td className={rv>0.2?"g":rv<0?"r":"w"}>{rv!=null?fmtPct(rv*100):"—"}</td>
                      <td className={mo>0.1?"g":mo<-0.1?"r":"w"}>{mo!=null?fmtPct(mo*100):"—"}</td>
                      <td>${r.position_size}</td>
                      <td>{r.executed?<span className="badge bb">Executed</span>:r.validated?<span className="badge bg">Validated</span>:<span className="badge bgr">Pending</span>}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
      }
    </div>
  );
};

const PositionsTable = ({ posData }) => {
  const positions = posData?.positions||[];
  return (
    <div className="card">
      <div className="ct">Open Positions ({positions.length})</div>
      {posData?.circuit_breaker_triggered && <div className="alert">⚠️ Circuit Breaker: {posData.circuit_breaker_reason}</div>}
      {!positions.length
        ? <div style={{color:"#8b949e",padding:"10px 0"}}>No open positions.</div>
        : <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Symbol</th><th>Qty</th><th>Entry</th><th>Current</th><th>Value</th><th>Unrealized P&L</th><th>%</th></tr></thead>
              <tbody>
                {positions.map(p=>{
                  const pct=(p.unrealized_plpc||0)*100;
                  return (
                    <tr key={p.symbol}>
                      <td><strong>{p.symbol}</strong></td>
                      <td>{p.qty}</td>
                      <td>${Number(p.avg_entry_price).toFixed(2)}</td>
                      <td>${Number(p.current_price).toFixed(2)}</td>
                      <td>${Number(p.market_value).toFixed(0)}</td>
                      <td className={pnlCls(p.unrealized_pl)}>{fmt$(p.unrealized_pl)}</td>
                      <td className={pnlCls(pct)}>{fmtPct(pct)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
      }
      {posData?.last_updated && <div className="ts">Last updated: {posData.last_updated}</div>}
    </div>
  );
};

const HistoryTable = ({ trades }) => {
  const closed = (trades||[]).filter(t=>t.status==="closed")
    .sort((a,b)=>(b.exit_date||"").localeCompare(a.exit_date||"")).slice(0,20);
  return (
    <div className="card">
      <div className="ct">Trade History (Last 20)</div>
      {!closed.length
        ? <div style={{color:"#8b949e",padding:"10px 0"}}>No closed trades yet.</div>
        : <div style={{overflowX:"auto"}}>
            <table>
              <thead><tr><th>Symbol</th><th>Entry</th><th>Exit</th><th>Entry $</th><th>Exit $</th><th>Qty</th><th>P&L</th><th>%</th><th>Conf</th><th>Result</th></tr></thead>
              <tbody>
                {closed.map((t,i)=>{
                  const win=(t.pnl||0)>0;
                  return (
                    <tr key={t.id||i}>
                      <td><strong>{t.symbol}</strong></td>
                      <td>{t.entry_date}</td>
                      <td>{t.exit_date||"—"}</td>
                      <td>${Number(t.entry_price).toFixed(2)}</td>
                      <td>{t.exit_price?`$${Number(t.exit_price).toFixed(2)}`:"—"}</td>
                      <td>{t.qty}</td>
                      <td className={pnlCls(t.pnl)}>{fmt$(t.pnl)}</td>
                      <td className={pnlCls(t.pnl_pct)}>{fmtPct(t.pnl_pct)}</td>
                      <td>{confBadge(t.confidence)}</td>
                      <td><span className={`badge ${win?"bg":"br"}`}>{win?"WIN":"LOSS"}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
      }
    </div>
  );
};

// ─── APP ───────────────────────────────────────────────────────────────────
const App = () => {
  const [d, setD] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [lastRefresh, setLastRefresh] = React.useState(null);

  const refresh = async () => {
    setLoading(true);
    const result = await loadData();
    setD(result);
    setLastRefresh(new Date().toLocaleTimeString());
    setLoading(false);
  };

  React.useEffect(() => {
    refresh();
    if (isHttp) {
      const t = setInterval(refresh, 5 * 60 * 1000);
      return () => clearInterval(t);
    }
  }, []);

  const halted = d?.budget?.halted;
  const isEmbedded = d && !d.live;
  const embeddedAt = d?.meta?.embedded_at;

  return (
    <div>
      <div className="hdr">
        <h1>📈 Earnings Trading Bot</h1>
        <div className="meta">
          {halted && <span className="badge br">⛔ HALTED</span>}
          {isEmbedded
            ? <span>Embedded snapshot{embeddedAt ? ` · ${embeddedAt.slice(0,16).replace("T"," ")}` : ""}</span>
            : <span>Live · auto-refresh 5 min{lastRefresh ? ` · ${lastRefresh}` : ""}</span>
          }
          <button className="btn" onClick={refresh}>↺ Refresh</button>
        </div>
      </div>
      <div className="main">
        {loading && !d && <div style={{color:"#8b949e",padding:40,textAlign:"center"}}>Loading...</div>}
        {d && <>
          {isEmbedded && (
            <div className="notice">
              📌 Showing embedded snapshot. To refresh data, run <strong>update_dashboard.bat</strong> in the project folder.
            </div>
          )}
          <MetricsRow positions={d.positions} trades={d.trades} />
          <PortfolioChart portfolioHist={d.portfolioHist} />
          <BudgetSection budget={d.budget} />
          <WinnersLosers positions={d.positions} />
          <TopFiveSection trades={d.trades} />
          <div className="g2">
            <AccuracyTracker accuracy={d.accuracy} callsLog={d.callsLog} />
            <EarningsWeek recs={d.recs} positions={d.positions} />
            <RecsTable recs={d.recs} positions={d.positions} />
          </div>
          <div className="g2">
            <PositionsTable posData={d.positions} />
            <HistoryTable trades={d.trades} />
          </div>
        </>}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
