# Railway build configuration — Hitman v2
#
# NOTE: Multi-service cron jobs are configured manually in the Railway dashboard.
# This file only controls how Railway builds the container (Python + requirements.txt).
#
# Service schedule reference (all times UTC, targeting EDT = UTC-4):
#   scanner   — "17 3 * * 1,3,5"   → 11:17 PM ET Mon/Wed/Fri only
#   validator — "11 12 * * 1-5"    → 8:11 AM ET weekdays
#   executor  — "0 19 * * 1-5"     → 3:00 PM ET weekdays
#   monitor   — "0 14-20 * * 1-5"  → hourly 10 AM–4 PM ET weekdays
#   reporter  — "30 20 * * 1-5"    → 4:30 PM ET weekdays
#   learner   — "0 10 * * 1"       → Monday 6 AM ET
#   dashboard — "*/30 13-21 * * 1-5" → every 30 min 9 AM–5 PM ET weekdays
#
# Start command pattern for each service:
#   bash scripts/run.sh <name> "<files to commit>"

[build]
builder = "nixpacks"
