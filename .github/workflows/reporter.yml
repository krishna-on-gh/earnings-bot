name: Reporter
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 1-5'
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install alpaca-py yfinance pandas requests tzdata python-docx
      - run: |
          git config user.email "bot@bot.com"
          git config user.name "EarningsBot"
          git pull --rebase origin main
      - run: python src/reporter.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - run: |
          git add data/ reports/
          git diff --cached --quiet && echo "no changes" || (git commit -m "reporter run" && git push)